          - generic [ref=f3e539]:
            - heading "Problem Statement" [level=3] [ref=f3e540]
            - paragraph [ref=f3e541]: Bangladesh faces severe flooding risks due to unique geographical location and climate patterns. Traditional methods lack accuracy and lead time.
          - generic [ref=f3e551]:
            - heading "Methodology" [level=3] [ref=f3e552]
            - paragraph [ref=f3e553]: Global ENSO prediction is combined with local discharge and climate features using XGBoost and LSTM for improved water level forecasting.
          - generic [ref=f3e560]:
            - heading "Datasets" [level=3] [ref=f3e561]
            - paragraph [ref=f3e562]: Historical climate data from 1980 onward, including ENSO indices, water levels, and weather observations from multiple sources.
          - generic [ref=f3e568]:
            - heading "AI Models" [level=3] [ref=f3e569]
            - paragraph [ref=f3e570]: An ensemble of machine learning models supports feature importance, sequence learning, and temporal pattern recognition.
          - generic [ref=f3e576]:
            - heading "Results" [level=3] [ref=f3e577]
            - paragraph [ref=f3e578]: Improved flood prediction accuracy with advance warning capability for more effective community preparation.
          - generic [ref=f3e585]:
            - heading "Future Scope" [level=3] [ref=f3e586]
            - paragraph [ref=f3e587]: Real-time satellite data, additional river systems, and mobile alerts can extend the platform for wider impact.
