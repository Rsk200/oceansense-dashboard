            - heading "Problem Statement" [level=3] [ref=f1e540]
            - paragraph [ref=f1e541]: Bangladesh faces severe flooding risks due to unique geographical location and climate patterns. Traditional methods lack accuracy and lead time.
          - generic [ref=f1e551]:
            - heading "Methodology" [level=3] [ref=f1e552]
            - paragraph [ref=f1e553]: Global ENSO prediction is combined with local discharge and climate features using XGBoost and LSTM for improved water level forecasting.
          - generic [ref=f1e560]:
            - heading "Datasets" [level=3] [ref=f1e561]
            - paragraph [ref=f1e562]: Historical climate data from 1980 onward, including ENSO indices, water levels, and weather observations from multiple sources.
          - generic [ref=f1e568]:
            - heading "AI Models" [level=3] [ref=f1e569]
            - paragraph [ref=f1e570]: An ensemble of machine learning models supports feature importance, sequence learning, and temporal pattern recognition.
          - generic [ref=f1e576]:
            - heading "Results" [level=3] [ref=f1e577]
            - paragraph [ref=f1e578]: Improved flood prediction accuracy with advance warning capability for more effective community preparation.
