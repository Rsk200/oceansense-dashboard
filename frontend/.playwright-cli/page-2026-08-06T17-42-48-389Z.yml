            - heading "Problem Statement" [level=3] [ref=f2e523]
            - paragraph [ref=f2e524]: Bangladesh faces severe flooding risks due to unique geographical location and climate patterns. Traditional methods lack accuracy and lead time.
          - generic [ref=f2e534]:
            - heading "Methodology" [level=3] [ref=f2e535]
            - paragraph [ref=f2e536]: Global ENSO prediction is combined with local discharge and climate features using XGBoost and LSTM for improved water level forecasting.
